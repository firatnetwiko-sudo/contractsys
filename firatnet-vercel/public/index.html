<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Firat Net Invoices</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: dark brand sidebar + working area. Form column beside a live A4 preview. Login screen gates everything. */
:root{
  --bg:#F1F3F6; --surface:#FFFFFF; --surface2:#E8EBF0; --ink:#1B1F27; --muted:#5B6472; --line:#D5DAE1;
  --accent:#E8920C; --on-accent:#1B1F27; --accent-text:#9A5A00; --danger:#B5372B; --ok:#1E7A4C; --focus:#1F4E9E;
  --side:#1B1F27; --side-ink:#F1F3F6; --side-muted:#98A1AF; --side-line:#2C323C;
  --p-bg:#FFFFFF; --p-ink:#1A1A1A; --p-line:#C9C9C9; --p-orange:#F0A021; --p-blue:#1F4E9E; --p-head:#E6E6E6; --p-dark:#222222; --p-muted:#555555;
  --font-ui:'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif;
  --font-paper:'Tajawal','IBM Plex Sans Arabic',Tahoma,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151A; --surface:#1B1F26; --surface2:#242932; --ink:#ECEEF2; --muted:#9AA3B0; --line:#303640;
    --accent:#F5A623; --on-accent:#1B1F27; --accent-text:#F5A623; --danger:#F07A6D; --ok:#5CC38A; --focus:#7FA8F0;
    --side:#0D0F13; --side-line:#222831; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12151A; --surface:#1B1F26; --surface2:#242932; --ink:#ECEEF2; --muted:#9AA3B0; --line:#303640;
  --accent:#F5A623; --on-accent:#1B1F27; --accent-text:#F5A623; --danger:#F07A6D; --ok:#5CC38A; --focus:#7FA8F0;
  --side:#0D0F13; --side-line:#222831; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ic{width:18px;height:18px;flex:none}
.muted{color:var(--muted)}
.num,.tn{font-variant-numeric:tabular-nums}

/* buttons + inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn.sm{height:32px;padding:0 10px;font-size:13px}
.btn.icon{width:32px;padding:0}
.btn.danger{color:var(--danger)}
.btn.wide{width:100%}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.in{width:100%;height:38px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
textarea.in{height:auto;min-height:72px;padding:8px 10px;resize:vertical}
select.in{padding-inline:8px}
.out{display:flex;align-items:center;height:38px;padding:0 10px;border-radius:8px;background:var(--surface2);font-variant-numeric:tabular-nums;font-weight:600}

/* auth */
#auth{display:grid;place-items:center;min-height:100vh;padding:24px 16px}
.auth-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 24px 20px;border-top:4px solid var(--accent)}
.auth-logo{display:block;width:96px;height:auto;margin:0 auto 10px}
.auth-card h1{margin:0;text-align:center;font-size:22px;font-weight:600;text-wrap:balance}
.auth-card .sub{margin:6px 0 20px;text-align:center;color:var(--muted)}
.fld{margin-bottom:14px}
.pw{display:flex;gap:8px}
.err{min-height:20px;margin:0 0 10px;color:var(--danger);font-size:13px}
.auth-foot{display:flex;justify-content:center;margin-top:16px}
.note{margin:14px 0 0;font-size:12px;color:var(--muted);text-align:center;text-wrap:balance}

/* app shell */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;padding:16px;min-height:100vh}
.side{position:sticky;top:16px;align-self:start;display:flex;flex-direction:column;gap:20px;background:var(--side);color:var(--side-ink);border-radius:14px;padding:18px 14px;max-height:calc(100vh - 32px);overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding-bottom:16px;border-bottom:1px solid var(--side-line)}
.brand img{width:46px;height:auto}
.brand b{display:block;font-size:16px;font-weight:700}
.brand small{display:block;color:var(--side-muted);font-size:12px}
.side nav{display:flex;flex-direction:column;gap:4px}
.nav{display:flex;align-items:center;gap:10px;width:100%;height:40px;padding:0 10px;border:0;border-radius:8px;background:none;color:var(--side-muted);cursor:pointer;text-align:start}
.nav:hover{background:var(--side-line);color:var(--side-ink)}
.nav[aria-current="page"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.nav .count{margin-inline-start:auto;min-width:22px;padding:0 6px;border-radius:99px;background:var(--side-line);color:var(--side-ink);font-size:12px;text-align:center;font-variant-numeric:tabular-nums}
.nav[aria-current="page"] .count{background:rgba(0,0,0,.18);color:var(--on-accent)}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.side label{color:var(--side-muted)}
.seg{display:flex;border:1px solid var(--side-line);border-radius:8px;overflow:hidden}
.seg button{flex:1;height:34px;border:0;background:none;color:var(--side-muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--side-ink);color:var(--side)}
.auth-foot .seg{width:220px;border-color:var(--line)}
.auth-foot .seg button{color:var(--muted)}
.auth-foot .seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.user{display:flex;align-items:center;gap:10px;padding-top:12px;border-top:1px solid var(--side-line)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;text-transform:uppercase;flex:none}
.user .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.side .lnk{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border:0;border-radius:8px;background:none;color:var(--side-muted);cursor:pointer;width:100%;text-align:start}
.side .lnk:hover{background:var(--side-line);color:var(--side-ink)}
main{min-width:0}

/* page */
.phead{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;margin-bottom:16px}
.phead h1{margin:0;font-size:22px;font-weight:600;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--surface2);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;direction:ltr}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);font-size:11px;font-weight:500}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
@media (min-width:1180px){.cols{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}.sticky{position:sticky;top:16px}}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.card h2{margin:0 0 14px;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid2 .full{grid-column:1/-1}
@media (max-width:520px){.grid2{grid-template-columns:minmax(0,1fr)}}

.irow{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;display:grid;gap:10px}
.ihead{display:flex;align-items:center;justify-content:space-between}
.irow .l4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.irow .l4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0}
.trow .v{font-weight:600;font-variant-numeric:tabular-nums}
.trow.final{margin-top:6px;padding-top:12px;border-top:2px solid var(--accent);font-size:17px;font-weight:700}
.disc{display:flex;gap:8px;width:min(260px,100%)}
.disc .in{min-width:0}

.prevcard{padding:12px}
.ptool{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:space-between;margin-bottom:10px}
.ptool h2{margin:0}
.hint{font-size:12px;color:var(--muted)}
.paper-wrap{position:relative;width:100%;overflow:hidden;background:#fff;border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.paper-slot{position:absolute;left:0;top:0;width:794px;transform-origin:top left}

/* list */
.search{max-width:420px;flex:1;min-width:200px}
.lhead,.inv-row{display:grid;grid-template-columns:110px minmax(0,1.5fr) 120px 140px minmax(0,330px);gap:12px;align-items:center;padding:12px 16px}
.lhead{font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.inv-row{border-bottom:1px solid var(--line)}
.inv-row:last-child{border-bottom:0}
.inv-row .no{font-weight:600;direction:ltr;text-align:start;font-variant-numeric:tabular-nums}
.inv-row .cu{min-width:0}
.inv-row .cu b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inv-row .tot{font-weight:600;font-variant-numeric:tabular-nums}
.racts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.confirm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;font-size:13px}
.empty{padding:40px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:14px}
.listcard{padding:0;overflow:hidden}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(8,10,14,.62);display:grid;place-items:center;padding:16px}
.sheet{width:min(860px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--surface);border-radius:14px;overflow:hidden}
.sheet.small{width:min(420px,100%)}
.shead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.shead h2{margin:0;font-size:16px;font-weight:600}
.sbody{padding:14px 16px;overflow:auto}
.toast{position:fixed;inset-inline:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:80;padding:0 16px}
.toast span{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;box-shadow:0 6px 24px rgba(0,0,0,.3)}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);gap:14px}
  .side{position:static;max-height:none;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px;padding:12px}
  .brand{border:0;padding:0}
  .side nav{flex-direction:row;flex-wrap:wrap}
  .nav{width:auto;padding:0 12px}
  .sidefoot{margin:0;flex-direction:row;flex-wrap:wrap;align-items:center;margin-inline-start:auto}
  .sidefoot .lang label{display:none}
  .user{border:0;padding:0}
  .lhead{display:none}
  .inv-row{grid-template-columns:minmax(0,1fr) auto;row-gap:6px}
  .inv-row .racts,.inv-row .confirm{grid-column:1/-1;justify-content:flex-start}
}

/* ============ A4 paper ============ */
.paper{position:relative;width:794px;min-height:1122px;padding:26px 36px 22px;background:var(--p-bg);color:var(--p-ink);font-family:var(--font-paper);font-size:13px;line-height:1.35;overflow:hidden;display:flex;flex-direction:column;text-align:start}
.paper *{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.p-wm{position:absolute;left:50%;top:54%;width:420px;transform:translate(-50%,-50%);opacity:.07;pointer-events:none}
.p-head{display:flex;direction:ltr;align-items:center;gap:18px;position:relative}
.p-logo{width:150px;flex:none}
.p-vr{width:1px;align-self:stretch;background:var(--p-line)}
.p-co{flex:1;text-align:center}
.p-name{font-size:22px;font-weight:800;line-height:1.3}
.p-en{display:flex;align-items:center;justify-content:center;gap:12px;margin:2px 0}
.p-en b{font-size:30px;font-weight:800;color:var(--p-orange);letter-spacing:1px;line-height:1.15;direction:ltr}
.p-en i{flex:0 0 44px;height:2px;background:var(--p-orange)}
.p-addr{font-size:17px;font-weight:500}
.p-tel{display:flex;direction:ltr;align-items:center;justify-content:center;gap:14px;font-size:18px;font-weight:500;margin-top:2px}
.p-tel span{display:inline-flex;align-items:center;gap:6px}
.p-tel .sep{width:1px;height:18px;background:var(--p-line)}
.p-reg{font-size:16px;color:var(--p-blue);font-weight:500;margin-top:2px}
.p-rule{height:1.5px;background:var(--p-dark);margin:12px 0 14px;position:relative}
.p-info{display:flex;justify-content:space-between;align-items:flex-start;gap:26px;position:relative}
.p-meta{width:268px;flex:none}
.p-cust{flex:1;min-width:0;padding-top:4px}
.p-title{display:inline-block;background:var(--p-dark);color:#fff;font-size:23px;font-weight:700;padding:8px 28px;border-radius:10px;margin-bottom:12px}
.p-f{display:flex;align-items:baseline;gap:8px;margin-bottom:13px;font-size:14px}
.p-f .l{white-space:nowrap;font-weight:500;min-width:72px}
.p-f .v{flex:1;min-width:0;min-height:21px;border-bottom:1.5px dotted #777;padding:0 4px;font-weight:600;word-break:break-word;text-align:center}
.p-tblbox{margin-top:12px;position:relative}
.p-tbl{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
.p-tbl th{background:var(--p-head);height:36px;font-size:14px;font-weight:600;text-align:center;padding:0 6px;border-top:1.5px solid var(--p-dark);border-bottom:1.5px solid var(--p-dark);border-left:1px solid #555}
.p-tbl td{height:32px;padding:2px 8px;font-size:13px;text-align:center;vertical-align:middle;border-bottom:1px solid #D2D2D2;border-left:1px solid #555;word-break:break-word}
.p-tbl td.d{text-align:center}
.p-tbl .ml{border-left:1.5px solid var(--p-dark)}
.p-tbl .mr{border-right:1.5px solid var(--p-dark)}
.p-tbl th.ml{border-top-left-radius:12px}.p-tbl th.mr{border-top-right-radius:12px}
.p-tbl tr.last td{border-bottom:1.5px solid var(--p-dark)}
.p-tbl tr.last td.ml{border-bottom-left-radius:12px}.p-tbl tr.last td.mr{border-bottom-right-radius:12px}
.p-tbl .nm{background:none;border:0}
.p-tbl td.nm{background:var(--p-dark);color:#fff;font-weight:700;font-size:15px;border-bottom:3px solid #fff;border-radius:7px;direction:ltr}
.p-tbl td.nm.last{border-bottom:3px solid #fff}
.p-tbl tr.last td.nm{border-bottom:3px solid #fff}
.p-bot{display:flex;gap:18px;margin-top:16px;position:relative;align-items:stretch}
.p-box{border:1.5px solid var(--p-dark);border-radius:12px;background:#fff}
.p-tot{width:300px;flex:none}
.p-row{display:flex;align-items:center;justify-content:space-between;gap:8px;height:38px;padding:0 14px;border-bottom:1px solid #999;font-size:14px;font-weight:500}
.p-row:last-child{border-bottom:0}
.p-row b{flex:1;text-align:center;font-weight:700;direction:ltr;font-variant-numeric:tabular-nums}
.p-row.fin{font-weight:700;font-size:15px}
.p-note{flex:1;min-width:0;padding:8px 14px;min-height:116px}
.p-note .l{font-size:14px;font-weight:500}
.p-note .t{text-align:center;white-space:pre-wrap;line-height:28px;font-weight:500;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 27px,#BBB 27px,#BBB 28px);min-height:84px;word-break:break-word}
.p-foot{margin-top:auto;position:relative}
.p-sign{display:flex;align-items:flex-end;justify-content:space-around;padding-top:34px}
.p-sign div{width:240px;text-align:center;font-size:14px;font-weight:500;border-top:1px solid var(--p-muted);padding-top:6px}
.p-sign .vr{width:1px;height:40px;border:0;padding:0;background:var(--p-line)}
.p-terms{margin-top:14px;padding-top:8px;border-top:1px solid #DDD;text-align:center;font-size:11px;color:var(--p-muted)}


/* dashboard */
.nav{height:auto;min-height:40px;padding-block:6px;line-height:1.3}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.sec{display:flex;flex-direction:column;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.sec-h{display:flex;align-items:center;gap:10px}
.sec-h h2{margin:0;font-size:16px;font-weight:600}
.sec-ic{width:38px;height:38px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;color:var(--accent-text);flex:none}
.sec .big{font-size:34px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.lbl{display:block;color:var(--muted);font-size:12px}
.kv{display:flex;flex-wrap:wrap;gap:8px 22px}
.kv div{display:flex;flex-direction:column;min-width:0}
.kv b{font-size:17px;font-weight:700}
.sec .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.dcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:16px;align-items:start}
@media (max-width:1000px){.dcols{grid-template-columns:minmax(0,1fr)}}
.act-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.act-row:last-child{border-bottom:0}
.act-row .m{min-width:0;flex:1}
.act-row .m b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act-row .m span{color:var(--muted);font-size:12px}
.st{display:inline-block;padding:1px 9px;border-radius:99px;background:var(--surface2);font-size:12px;font-weight:600;white-space:nowrap}
.st.active{color:var(--ok)}.st.soon{color:var(--accent-text)}.st.expired{color:var(--danger)}.st.upcoming{color:var(--focus)}
.inv-row .cu .muted{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
@media (min-width:901px){.lhead.ct,.inv-row.ct{grid-template-columns:110px minmax(0,1.5fr) 230px 120px minmax(0,330px)}}
.clhint{margin:-6px 0 12px}
/* contract paper */
.st.open{color:var(--muted)}
.paper.ct{min-height:1000px;page:ct}
.c-ttl{text-align:center;margin:0 0 12px;position:relative}
.c-ttl .p-title{margin:0;font-size:22px}
.c-meta{display:flex;gap:24px;position:relative}
.c-meta .p-f{flex:1;margin-bottom:8px}
.c-ln{margin:3px 0;font-size:13.5px;word-break:break-word}
.c-ln b{font-weight:700}
.c-h{position:relative;margin:12px 0 4px;font-size:15px;font-weight:800;break-after:avoid}
.c-p{position:relative;margin:0 0 6px;font-size:13.5px;line-height:1.85;text-align:justify}
.c-p.tight{margin-bottom:2px}
.c-ol,.c-ul{position:relative;margin:0 0 6px;padding-inline-start:26px;font-size:13.5px;line-height:1.85}
.c-ol li,.c-ul li{margin-bottom:2px;text-align:justify}
.blank{display:inline-block;min-width:150px;height:1em;border-bottom:1.5px dotted #666;vertical-align:baseline}
.blank.full{display:block;min-width:0;height:1.7em;margin-bottom:4px}
.fv{font-weight:700}
.c-tbl{position:relative;width:100%;border-collapse:collapse;margin:6px 0 10px;font-size:13px}
.c-tbl th,.c-tbl td{border:1px solid var(--p-dark);padding:4px 8px;height:30px;text-align:center;word-break:break-word}
.c-tbl th{background:var(--p-head);font-weight:700}
.c-tbl tr{break-inside:avoid}
.c-sig{position:relative;display:flex;gap:30px;margin-top:22px;break-inside:avoid}
.c-sig>div{flex:1;min-width:0}
.c-sig h4{margin:0 0 8px;font-size:14px;font-weight:800}
.c-wit{position:relative;display:flex;gap:30px;margin-top:10px;break-inside:avoid}
.c-wit>div{flex:1;min-width:0}
/* users + attachments */
.chk{display:flex;align-items:center;gap:10px;margin:0 0 8px;font-size:14px;color:var(--ink);cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.pm{display:inline-block;padding:1px 9px;margin:2px 0;margin-inline-end:4px;border-radius:99px;background:var(--surface2);font-size:12px}
.st.off{color:var(--muted)}
@media (min-width:901px){.lhead.ur,.inv-row.ur{grid-template-columns:minmax(0,1.1fr) 90px minmax(0,1.9fr) 90px minmax(0,auto)}}
.btn .bd{min-width:18px;padding:0 5px;border-radius:99px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700;line-height:18px;text-align:center}
.frow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.frow .m{flex:1;min-width:0}
.frow .m b{display:block;overflow-wrap:anywhere}
.frow .m span{font-size:12px;color:var(--muted)}
.pvimg{display:block;max-width:100%;max-height:70vh;margin:0 auto;border-radius:6px}
.pvframe{width:100%;height:70vh;border:1px solid var(--line);border-radius:6px;background:#fff}
.none-card{max-width:520px;margin:10vh auto;text-align:center}
.user .nm span,.user .nm small{display:block;overflow:hidden;text-overflow:ellipsis}
.user .nm small{font-size:11px;font-weight:400;color:var(--side-muted)}
#printRoot{display:none}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff!important}
  #auth,#app,#modal,#pwModal,#userModal,#fileModal,#pvModal,#toast{display:none!important}
  #printRoot{display:block!important}
  #printRoot .paper{box-shadow:none}
  @page ct{margin:14mm 0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<!-- ================= LOGIN ================= -->
<section id="auth" hidden>
  <div class="auth-card">
    <img id="authLogo" class="auth-logo" alt="Firat Net">
    <h1 id="authTitle"></h1>
    <p class="sub" id="authSub"></p>
    <form id="authForm" novalidate>
      <div class="fld"><label for="a-user" data-t="username"></label><input class="in" id="a-user" autocomplete="username" autocapitalize="off" spellcheck="false"></div>
      <div class="fld"><label for="a-pass" data-t="password"></label>
        <div class="pw"><input class="in" id="a-pass" type="password" autocomplete="current-password"><button type="button" class="btn" id="a-eye" data-t="showPw"></button></div></div>
      <div class="fld" id="a-confirm-wrap" hidden><label for="a-pass2" data-t="confirmPw"></label><input class="in" id="a-pass2" type="password" autocomplete="new-password"></div>
      <p class="err" id="a-err" role="alert"></p>
      <button class="btn primary wide" id="a-submit" type="submit"></button>
    </form>
    <p class="note" id="authNote"></p>
    <div class="auth-foot"><div class="seg" role="group" aria-label="Language"><button type="button" data-lang="ar">العربية</button><button type="button" data-lang="en">English</button></div></div>
  </div>
</section>

<!-- ================= APP ================= -->
<div class="app" id="app" hidden>
  <aside class="side">
    <div class="brand"><img id="sideLogo" alt="Firat Net"><div><b data-t="appName"></b><small data-t="appSub"></small></div></div>
    <nav>
      <button type="button" class="nav" data-view="dash" id="nav-dash"></button>
      <button type="button" class="nav" data-view="new" id="nav-new"></button>
      <button type="button" class="nav" data-view="list" id="nav-list"></button>
      <button type="button" class="nav" data-view="tower" id="nav-tower"></button>
      <button type="button" class="nav" data-view="complex" id="nav-complex"></button>
      <button type="button" class="nav" data-view="users" id="nav-users" hidden></button>
    </nav>
    <div class="sidefoot">
      <div class="lang"><label data-t="langLabel"></label>
        <div class="seg" role="group" aria-label="Language"><button type="button" data-lang="ar">العربية</button><button type="button" data-lang="en">English</button></div></div>
      <div class="user"><span class="avatar" id="avatar"></span><span class="nm"><span id="uname"></span><small id="uRole"></small></span></div>
      <button type="button" class="lnk" id="btnPw"></button>
      <button type="button" class="lnk" id="btnLogout"></button>
    </div>
  </aside>

  <main>
    <!-- DASHBOARD -->
    <section id="v-dash" hidden>
      <div class="phead"><h1 data-t="dashTitle"></h1><span class="muted" data-t="dashSub"></span></div>
      <div class="dgrid" id="dSections"></div>
      <div class="dcols">
        <div class="card"><h2 data-t="attention"></h2><div id="dAttn"></div></div>
        <div class="card"><h2 data-t="latest"></h2><div id="dLatest"></div></div>
      </div>
    </section>

    <!-- NEW INVOICE -->
    <section id="v-new" hidden>
      <div class="phead">
        <h1><span id="newTitle"></span><span class="chip" id="invNo"></span></h1>
        <div class="actions">
          <button type="button" class="btn" id="btnNew"></button>
          <button type="button" class="btn primary" id="btnSave"></button>
        </div>
      </div>
      <div class="cols">
        <form class="stack" id="form" novalidate onsubmit="return false">
          <div class="card">
            <h2 data-t="secCustomer"></h2>
            <div class="grid2">
              <div class="full"><label for="f-customer" data-t="customer"></label><input class="in" id="f-customer" data-f="customer" autocomplete="off"></div>
              <div><label for="f-address" data-t="address"></label><input class="in" id="f-address" data-f="address" autocomplete="off"></div>
              <div><label for="f-phone" data-t="phone"></label><input class="in" id="f-phone" data-f="phone" inputmode="tel" autocomplete="off" dir="ltr"></div>
              <div><label for="f-date" data-t="date"></label><input class="in" id="f-date" data-f="date" type="date"></div>
              <div><label for="f-currency" data-t="currency"></label><select class="in" id="f-currency" data-f="currency"><option value="SYP"></option><option value="USD"></option></select></div>
            </div>
          </div>
          <div class="card">
            <h2><span data-t="secItems"></span><button type="button" class="btn sm" id="btnAdd"></button></h2>
            <div id="items"></div>
          </div>
          <div class="card">
            <h2 data-t="secTotals"></h2>
            <div class="trow"><span data-t="subtotal"></span><span class="v" id="t-sub"></span></div>
            <div class="trow"><span data-t="discount"></span>
              <div class="disc"><input class="in num" id="f-discVal" data-f="discVal" type="number" inputmode="decimal" min="0" step="any" aria-label="discount"><select class="in" id="f-discType" data-f="discType"><option value="amount"></option><option value="percent"></option></select></div></div>
            <div class="trow final"><span data-t="finalTotal"></span><span class="v" id="t-final"></span></div>
          </div>
          <div class="card">
            <h2 data-t="secExtra"></h2>
            <div class="fld"><label for="f-notes" data-t="notes"></label><textarea class="in" id="f-notes" data-f="notes"></textarea></div>
            <div><label for="f-terms" data-t="terms"></label><textarea class="in" id="f-terms" data-f="terms"></textarea></div>
          </div>
        </form>
        <div class="card prevcard sticky">
          <div class="ptool">
            <h2 data-t="preview"></h2>
            <div class="actions" id="prevActions">
              <button type="button" class="btn sm" data-act="print-draft"></button>
              <button type="button" class="btn sm" data-act="pdf-draft"></button>
            </div>
          </div>
          <p class="hint" id="embedHint" hidden></p>
          <div class="paper-wrap" id="prevWrap"><div class="paper-slot"></div></div>
        </div>
      </div>
    </section>

    <!-- PREVIOUS INVOICES -->
    <section id="v-list" hidden>
      <div class="phead">
        <h1 data-t="listTitle"></h1>
        <input class="in search" id="search" type="search" aria-label="search" autocomplete="off">
      </div>
      <div class="card listcard"><div id="list"></div></div>
    </section>
    <!-- USERS -->
    <section id="v-users" hidden>
      <div class="phead"><h1 data-t="usersTitle"></h1><div class="actions"><button type="button" class="btn primary" id="uNew"></button></div></div>
      <p class="hint" data-t="usersHint"></p>
      <div class="card listcard"><div id="uList"></div></div>
    </section>
    <section id="v-none" hidden><div class="card none-card"><p data-t="noAccess"></p></div></section>

    <!-- CONTRACT LIST -->
    <section id="v-ctlist" hidden>
      <div class="phead">
        <h1 id="ctListTitle"></h1>
        <div class="actions"><input class="in search" id="ctSearch" type="search" aria-label="search" autocomplete="off"><button type="button" class="btn primary" id="ctListNew"></button></div>
      </div>
      <div class="card listcard"><div id="ctList"></div></div>
    </section>

    <!-- CONTRACT FORM -->
    <section id="v-ctform" hidden>
      <div class="phead">
        <h1><span id="ctTitle"></span><span class="chip" id="ctNoChip"></span></h1>
        <div class="actions"><button type="button" class="btn" id="ctBtnNew"></button><button type="button" class="btn primary" id="ctBtnSave"></button></div>
      </div>
      <div class="cols">
        <form class="stack" id="ctForm" novalidate onsubmit="return false">
          <p class="hint" data-t="arHint"></p>
          <div class="card">
            <h2 data-t="secCtMeta"></h2>
            <div class="grid2">
              <div><label for="c-no" data-t="ctNo"></label><input class="in" id="c-no" data-c="no" dir="ltr" autocomplete="off"></div>
              <div><label for="c-date" data-t="ctDate"></label><input class="in" id="c-date" data-c="date" type="date"></div>
            </div>
          </div>
          <div class="card">
            <h2 data-t="secFirst"></h2>
            <div class="grid2">
              <div class="full" data-for="complex"><label for="c-company" data-t="company"></label><input class="in" id="c-company" data-c="company" autocomplete="off"></div>
              <div><label for="c-firstRep" data-t="firstRep"></label><input class="in" id="c-firstRep" data-c="firstRep" autocomplete="off"></div>
              <div data-for="complex"><label for="c-capacity" data-t="capacity"></label><input class="in" id="c-capacity" data-c="capacity" autocomplete="off"></div>
            </div>
          </div>
          <div class="card">
            <h2 id="c-secParty"></h2>
            <div class="grid2">
              <div class="full"><label for="c-partyName" id="c-l-partyName"></label><input class="in" id="c-partyName" data-c="partyName" autocomplete="off"></div>
              <div class="full"><label for="c-location" id="c-l-location"></label><input class="in" id="c-location" data-c="location" autocomplete="off"></div>
              <div><label for="c-idNo" data-t="idNo"></label><input class="in" id="c-idNo" data-c="idNo" dir="ltr" autocomplete="off"></div>
              <div data-for="complex"><label for="c-phone" data-t="phone"></label><input class="in" id="c-phone" data-c="phone" inputmode="tel" dir="ltr" autocomplete="off"></div>
            </div>
          </div>
          <div class="card">
            <h2 data-t="secTerm"></h2>
            <div class="grid2">
              <div class="full"><label for="c-duration" data-t="duration"></label><input class="in" id="c-duration" data-c="duration" autocomplete="off"></div>
              <div data-for="tower"><label for="c-startDate" data-t="startDate"></label><input class="in" id="c-startDate" data-c="startDate" type="date"></div>
              <div><label for="c-endDate" id="c-l-endDate"></label><input class="in" id="c-endDate" data-c="endDate" type="date"></div>
            </div>
          </div>
          <div class="card" data-for="tower">
            <h2 data-t="secRent"></h2>
            <div class="grid2">
              <div><label for="c-rentAmount" data-t="rentAmount"></label><input class="in num" id="c-rentAmount" data-c="rentAmount" type="number" inputmode="decimal" min="0" step="any"></div>
              <div><label for="c-currency" data-t="currency"></label><select class="in" id="c-currency" data-c="currency"><option value="SYP"></option><option value="USD"></option></select></div>
              <div class="full"><label for="c-cycle" data-t="cycle"></label><select class="in" id="c-cycle" data-c="cycle"><option value="M"></option><option value="Q"></option><option value="Y"></option></select></div>
              <div class="full"><label for="c-payTerms" data-t="payTerms"></label><textarea class="in" id="c-payTerms" data-c="payTerms"></textarea></div>
            </div>
          </div>
          <div class="card" data-for="tower">
            <h2 data-t="secOps"></h2>
            <label for="c-opCosts" data-t="opCosts"></label><textarea class="in" id="c-opCosts" data-c="opCosts"></textarea>
          </div>
          <div class="card" data-for="tower">
            <h2 data-t="secEnd"></h2>
            <div class="grid2">
              <div class="full"><label for="c-cureDays" data-t="cureDays"></label><input class="in num" id="c-cureDays" data-c="cureDays" type="number" inputmode="numeric" min="0" step="1"></div>
              <div><label for="c-witness1" data-t="witness1"></label><input class="in" id="c-witness1" data-c="witness1" autocomplete="off"></div>
              <div><label for="c-witness2" data-t="witness2"></label><input class="in" id="c-witness2" data-c="witness2" autocomplete="off"></div>
            </div>
          </div>
          <div class="card" data-for="complex">
            <h2><span data-t="secDevices"></span><button type="button" class="btn sm" id="btnAddDev"></button></h2>
            <div id="devices"></div>
          </div>
          <div class="card">
            <h2 data-t="secNotes"></h2>
            <textarea class="in" id="c-notes" data-c="notes" aria-label="notes"></textarea>
            <p class="hint" data-t="notesHint"></p>
          </div>
        </form>
        <div class="card prevcard sticky">
          <div class="ptool">
            <h2 data-t="previewCt"></h2>
            <div class="actions" id="cPrevActions">
              <button type="button" class="btn sm" data-act="print-draft"></button>
              <button type="button" class="btn sm" data-act="pdf-draft"></button>
            </div>
          </div>
          <p class="hint" id="cEmbedHint" hidden></p>
          <div class="paper-wrap" id="cPrevWrap"><div class="paper-slot"></div></div>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="shead"><h2 id="mTitle"></h2>
      <div class="actions" id="mActions"></div></div>
    <div class="sbody">
      <p class="hint" id="mHint" hidden></p>
      <div class="paper-wrap" id="modalWrap"><div class="paper-slot"></div></div>
    </div>
  </div>
</div>

<div class="modal" id="pwModal" hidden>
  <div class="sheet small" role="dialog" aria-modal="true">
    <div class="shead"><h2 data-t="changePw"></h2><button type="button" class="btn sm icon" id="pwClose" aria-label="close"></button></div>
    <form class="sbody" id="pwForm" novalidate>
      <div class="fld"><label for="pw-cur" data-t="curPw"></label><input class="in" id="pw-cur" type="password" autocomplete="current-password"></div>
      <div class="fld"><label for="pw-new" data-t="newPw"></label><input class="in" id="pw-new" type="password" autocomplete="new-password"></div>
      <div class="fld"><label for="pw-new2" data-t="confirmPw"></label><input class="in" id="pw-new2" type="password" autocomplete="new-password"></div>
      <p class="err" id="pw-err" role="alert"></p>
      <button type="submit" class="btn primary wide" data-t="savePw"></button>
    </form>
  </div>
</div>

<div class="modal" id="userModal" hidden>
  <div class="sheet small" role="dialog" aria-modal="true">
    <div class="shead"><h2 id="uTitle"></h2><button type="button" class="btn sm icon" id="uClose" aria-label="close"></button></div>
    <form class="sbody" id="uForm" novalidate>
      <div class="fld"><label for="u-name" data-t="username"></label><input class="in" id="u-name" dir="ltr" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
      <div class="fld"><label for="u-pass" id="u-pass-l"></label><input class="in" id="u-pass" type="text" dir="ltr" autocomplete="off"></div>
      <div class="fld"><label for="u-role" data-t="role"></label><select class="in" id="u-role"><option value="user"></option><option value="admin"></option></select></div>
      <div class="fld" id="u-perms"><label data-t="perms"></label>
        <label class="chk"><input type="checkbox" id="p-view"><span data-t="pView"></span></label>
        <label class="chk"><input type="checkbox" id="p-create"><span data-t="pCreate"></span></label>
        <label class="chk"><input type="checkbox" id="p-edit"><span data-t="pEdit"></span></label>
        <label class="chk"><input type="checkbox" id="p-delete"><span data-t="pDelete"></span></label>
      </div>
      <label class="chk"><input type="checkbox" id="u-active"><span data-t="uActive"></span></label>
      <p class="err" id="u-err" role="alert"></p>
      <button type="submit" class="btn primary wide" data-t="uSave"></button>
    </form>
  </div>
</div>

<div class="modal" id="fileModal" hidden>
  <div class="sheet small" role="dialog" aria-modal="true" style="width:min(560px,100%)">
    <div class="shead"><h2 id="fTitle"></h2><button type="button" class="btn sm icon" id="fClose" aria-label="close"></button></div>
    <div class="sbody">
      <p class="hint" data-t="attachHint"></p>
      <div id="fList"></div>
      <div style="margin-top:12px"><input type="file" id="fInput" accept="application/pdf,image/*" multiple hidden><button type="button" class="btn primary wide" id="fPick"></button></div>
    </div>
  </div>
</div>

<div class="modal" id="pvModal" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="shead"><h2 id="pvTitle"></h2><div class="actions" id="pvActions"></div></div>
    <div class="sbody" id="pvBody"></div>
  </div>
</div>

<div class="toast" id="toast" aria-live="polite"></div>
<div id="printRoot"></div>

async function apiJson(path,body,method){
  let r;
  try{r=await fetch('/api/'+path,{method:method||(body?'POST':'GET'),headers:body?{'content-type':'application/json'}:{},body:body?JSON.stringify(body):undefined,credentials:'same-origin',cache:'no-store'})}
  catch(e){return{ok:false,status:0,data:null}}
  let data=null;try{data=await r.json()}catch(e){}
  return{ok:r.ok,status:r.status,data};
}
const snap={invoices:new Map(),contracts:new Map()};
const setSnap=(c,arr)=>{snap[c]=new Map(arr.map(x=>[x.id,JSON.stringify(x)]))};
let syncQ=Promise.resolve(),pendingSync=0;
function pushSync(c){
  const arr=c==='invoices'?invoices:contracts,old=snap[c],up=[],seen=new Set();
  arr.forEach(x=>{seen.add(x.id);if(old.get(x.id)!==JSON.stringify(x))up.push(clone(x))});
  const del=[...old.keys()].filter(id=>!seen.has(id));
  if(!up.length&&!del.length)return;
  setSnap(c,arr);pendingSync++;
  syncQ=syncQ.then(async()=>{
    const r=await apiJson('sync',{c,up,del});
    if(r.status===401){forceLogout();return}
    if(!r.ok){toast(r.status===403?tt('eNoPerm'):tt('tSyncFail'));await loadState()}
  }).catch(()=>toast(tt('tSyncFail'))).then(()=>{pendingSync--});
}
async function loadState(){
  const r=await apiJson('state');
  if(r.status===401||!r.data)return r.status===401?null:Promise.reject(new Error('net'));
  const d=r.data;
  invoices=d.invoices||[];contracts=d.contracts||[];users=d.users||[];
  setSnap('invoices',invoices);setSnap('contracts',contracts);
  return d.me;
}
function forceLogout(){
  if(!me)return;

const rnd=()=>{try{const a=new Uint8Array(16);crypto.getRandomValues(a);return [...a].map(b=>b.toString(16).padStart(2,'0')).join('')}catch(e){return Math.random().toString(16).slice(2)+Date.now().toString(16)}};
async function hashPw(pw,salt,alg){
  if(alg==='pbkdf2'){
    const enc=new TextEncoder();
    const key=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
    const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:120000,hash:'SHA-256'},key,256);
    return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  let h1=0xdeadbeef,h2=0x41c6ce57;const s=salt+':'+pw;
  for(let r=0;r<3000;r++)for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (h2>>>0).toString(16).padStart(8,'0')+(h1>>>0).toString(16).padStart(8,'0');
}

async function makeCred(pw){
  const salt=rnd();
  if(canSubtle()){try{return{salt,alg:'pbkdf2',hash:await hashPw(pw,salt,'pbkdf2')}}catch(x){}}

}

const docHTML=(d,l)=>d.type?ctPaperHTML(d,l):paperHTML(d,l);
function fit(wrap){
  const slot=$('.paper-slot',wrap),w=wrap.clientWidth;
  if(!w||!slot)return;
  const s=w/794;slot.style.transform=`scale(${s})`;wrap.style.height=Math.ceil(slot.offsetHeight*s)+'px';
}
const ro=window.ResizeObserver?new ResizeObserver(es=>es.forEach(e=>fit(e.target))):null;
function paintWrap(wrap,d){$('.paper-slot',wrap).innerHTML=docHTML(d,lang);fit(wrap)}

/* ---------- print / pdf ---------- */
function doPrint(d){
  $('#printRoot').innerHTML=docHTML(d,lang);
  const go=()=>setTimeout(()=>window.print(),80);
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(go);
}
window.addEventListener('afterprint',()=>{$('#printRoot').innerHTML=''});
async function doPdf(d){
  if(typeof window.html2pdf==='undefined'){toast(tt('tPdfFallback'));doPrint(d);return}
  toast(tt('tPdf'));
  const host=document.createElement('div');
  host.style.cssText='position:fixed;left:-10000px;top:0;width:794px;background:#fff;direction:ltr';
  host.innerHTML=docHTML(d,lang);document.body.appendChild(host);
  try{
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    const el=host.firstElementChild;if(!d.type)el.style.minHeight='1120px';
    await window.html2pdf().set({margin:d.type?[10,0,10,0]:0,filename:d.no+'.pdf',image:{type:'jpeg',quality:0.98},html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff',scrollX:0,scrollY:0},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy']}}).from(el).save();
  }catch(e){toast(tt('tPdfFail'))}finally{host.remove()}
}

function rowTotalText(it){return (String(it.qty)!==''&&String(it.price)!=='')?fmt(num(it.qty)*num(it.price)):'—'}
function renderItems(){
  $('#items').innerHTML=draft.items.map((it,i)=>`<div class="irow" data-i="${i}">
    <div class="ihead"><span class="tag">${esc(tt('item'))} ${i+1}</span><button type="button" class="btn sm icon danger" data-act="rm" title="${esc(tt('removeRow'))}" aria-label="${esc(tt('removeRow'))}">${ic('trash')}</button></div>
    <div><label>${esc(tt('desc'))}</label><input class="in" data-k="desc" value="${esc(it.desc)}" placeholder="${i===0?esc(tt('descPh')):''}"></div>
    <div class="l4">
      <div><label>${esc(tt('qty'))}</label><input class="in num" data-k="qty" type="number" inputmode="decimal" min="0" step="any" value="${esc(it.qty)}"></div>
      <div><label>${esc(tt('price'))}</label><input class="in num" data-k="price" type="number" inputmode="decimal" min="0" step="any" value="${esc(it.price)}"></div>
      <div><label>${esc(tt('rowTotal'))}</label><output class="out" data-rt>${rowTotalText(it)}</output></div>
      <div><label>${esc(tt('notes'))}</label><input class="in" data-k="notes" value="${esc(it.notes)}"></div>
    </div></div>`).join('');
}
function syncForm(){
  ['customer','address','phone','date','currency','discVal','discType','notes','terms'].forEach(k=>{const el=$('#f-'+k);if(el)el.value=draft[k]==null?'':draft[k]});
  renderItems();refresh();
}
function refresh(){
  const t=totals(draft),cur=curLabel(draft.currency,lang);
  $('#t-sub').textContent=fmt(t.sub)+' '+cur;
  $('#t-final').textContent=fmt(t.total)+' '+cur;
  $('#invNo').textContent=draft.no;
  $('#newTitle').textContent=draft.id?tt('editTitle'):tt('newTitle');
  $('#btnSave').innerHTML=ic('save')+esc(draft.id?tt('update'):tt('save'));
  paintWrap($('#prevWrap'),draft);
}
$('#form').addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.f){draft[el.dataset.f]=el.value}
  else if(el.dataset.k){const row=el.closest('[data-i]'),it=draft.items[row.dataset.i];it[el.dataset.k]=el.value;$('[data-rt]',row).textContent=rowTotalText(it)}
  else return;
  refresh();
});
$('#form').addEventListener('click',e=>{
  const b=e.target.closest('[data-act="rm"]');if(!b)return;
  const i=+b.closest('[data-i]').dataset.i;
  if(draft.items.length<=1)draft.items[0]=blankItem();else draft.items.splice(i,1);
  renderItems();refresh();
});
$('#btnAdd').onclick=()=>{draft.items.push(blankItem());renderItems();refresh();const ins=$$('#items [data-k="desc"]');ins[ins.length-1].focus()};
$('#btnNew').onclick=()=>{draft=blankDraft();syncForm();window.scrollTo(0,0)};
$('#btnSave').onclick=()=>{
  const t=tt;
  if(draft.id?!can('edit'):!can('create')){toast(t('eNoPerm'));return}
  if(!draft.customer.trim()){toast(t('tNeedCustomer'));$('#f-customer').focus();return}
  const items=draft.items.filter(i=>i.desc||String(i.qty)!==''||String(i.price)!==''||i.notes);
  if(!items.some(i=>num(i.qty)>0&&num(i.price)>0)){toast(t('tNeedItem'));return}
  const tot=totals({...draft,items});
  const inv={...clone(draft),items:clone(items),subtotal:tot.sub,discount:tot.disc,total:tot.total,example:false};
  if(!inv.id){
    if(invoices.some(i=>i.no===inv.no))inv.no=seqNo().no;
    inv.id='i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);inv.createdAt=Date.now();
    invoices.push(inv);
  }else{
    const ix=invoices.findIndex(i=>i.id===inv.id);
    if(ix>=0){inv.createdAt=invoices[ix].createdAt;inv.files=invoices[ix].files||[];invoices[ix]=inv}else invoices.push(inv);
  }
  persist();draft=clone(inv);if(!draft.items.length)draft.items=[blankItem()];
  syncForm();updateCount();toast(t('tSaved'));
};
$('#prevActions').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;b.dataset.act==='print-draft'?doPrint(draft):doPdf(draft)});

const updateCount=()=>{const set=(id,n)=>{const el=$('#'+id+' .count');if(el)el.textContent=n};set('nav-list',invoices.length);set('nav-tower',contracts.filter(c=>c.type==='tower').length);set('nav-complex',contracts.filter(c=>c.type==='complex').length)};
function renderList(){
  const q=$('#search').value.trim().toLowerCase();
  const arr=invoices.filter(i=>!q||(i.no+' '+i.customer+' '+i.phone).toLowerCase().includes(q))
    .sort((a,b)=>(parseInt(String(b.no).replace(/\D/g,''),10)||0)-(parseInt(String(a.no).replace(/\D/g,''),10)||0));
  const box=$('#list');
  if(!arr.length){
    box.innerHTML=`<div class="empty"><span>${esc(invoices.length?tt('noMatch'):tt('emptyList'))}</span>${(invoices.length||!can('create'))?'':`<button type="button" class="btn primary" data-act="goNew">${ic('plus')}${esc(tt('emptyBtn'))}</button>`}</div>`;return;
  }
  const doc=!EMBEDDED;
  box.innerHTML=`<div class="lhead"><span>${esc(tt('colNo'))}</span><span>${esc(tt('colCustomer'))}</span><span>${esc(tt('colDate'))}</span><span>${esc(tt('colTotal'))}</span><span></span></div>`+arr.map(i=>{
    const cur=curLabel(i.currency,lang);

$('#search').addEventListener('input',renderList);
$('#list').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const id=b.dataset.id,inv=invoices.find(i=>i.id===id),a=b.dataset.act;
  if(a==='goNew')show('new');
  else if(a==='view')openModal(id);
  else if(a==='print')doPrint(inv);
  else if(a==='pdf')doPdf(inv);
  else if(a==='files')openFiles('inv',id);
  else if(a==='edit')loadForEdit(inv);
  else if(a==='del'){confirmId=id;renderList()}
  else if(a==='delno'){confirmId=null;renderList()}
  else if(a==='delyes'){

    deleteFilesOf(invoices.find(i=>i.id===id));
    invoices=invoices.filter(i=>i.id!==id);confirmId=null;persist();

function loadForEdit(inv){
  if(!can('edit')){toast(tt('eNoPerm'));return}

/* ---------- attachments (signed copies) ---------- */
const CH=450*1024;
const FS={
  async put(id,blob){
    const n=Math.max(1,Math.ceil(blob.size/CH));
    for(let i=0;i<n;i++){
      let r;try{r=await fetch('/api/file?id='+id+'&i='+i,{method:'POST',headers:{'content-type':'application/octet-stream'},body:blob.slice(i*CH,(i+1)*CH),credentials:'same-origin'})}catch(e){r=null}
      if(!r||!r.ok){await this.del(id,blob.size).catch(()=>{});throw new Error('upload')}
    }
  },
  async get(id,size,type){
    const n=Math.max(1,Math.ceil((size||1)/CH)),parts=[];
    for(let i=0;i<n;i++){const r=await fetch('/api/file?id='+id+'&i='+i,{credentials:'same-origin'});if(!r.ok)throw new Error('dl');parts.push(await r.arrayBuffer())}
    return new Blob(parts,{type:type||'application/octet-stream'});
  },
  async del(id,size){const n=Math.max(1,Math.ceil((size||1)/CH));await fetch('/api/file?id='+id+'&n='+n,{method:'DELETE',credentials:'same-origin'})}
};
const LFS={
  get(id){return new Promise((res,rej)=>{try{const r=indexedDB.open('firatnet-files',1);r.onupgradeneeded=()=>{r.result.createObjectStore('blobs')};r.onerror=()=>rej(r.error);r.onsuccess=()=>{try{const q=r.result.transaction('blobs','readonly').objectStore('blobs').get(id);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}catch(e){rej(e)}}}catch(e){rej(e)}})}
};
let fileCtx=null,fileConfirm=null,pvUrl='',pvFile=null;
const fileDoc=()=>fileCtx?(fileCtx.kind==='ct'?contracts:invoices).find(d=>d.id===fileCtx.id):null;
const persistDoc=()=>{fileCtx&&fileCtx.kind==='ct'?persistC():persist()};
const isoOf=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const fmtSize=n=>n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
function deleteFilesOf(d){((d&&d.files)||[]).forEach(f=>{FS.del(f.id,f.size).catch(()=>{})})}
function rowActs(kind,d){
  const t=T[lang],doc=!EMBEDDED,n=(d.files||[]).length;
  if(confirmId===d.id)return `<div class="confirm"><span>${esc(kind==='ct'?t.confirmDelCt:t.confirmDel)}</span><button type="button" class="btn sm danger" data-act="delyes" data-id="${d.id}">${esc(t.yes)}</button><button type="button" class="btn sm" data-act="delno">${esc(t.no)}</button></div>`;
  const b=(act,label,icon,extra)=>`<button type="button" class="btn sm" data-act="${act}" data-id="${d.id}">${ic(icon)}${label}${extra||''}</button>`;
  return `<div class="racts">${b('view',esc(t.view),'eye')}${doc?b('print',esc(t.print),'print')+b('pdf','PDF','pdf'):''}${b('files',esc(t.attach),'clip',n?`<span class="bd">${n}</span>`:'')}${can('edit')?b('edit',esc(t.edit),'edit'):''}${can('delete')?`<button type="button" class="btn sm icon danger" data-act="del" data-id="${d.id}" title="${esc(t.del)}" aria-label="${esc(t.del)}">${ic('trash')}</button>`:''}</div>`;
}

$('#fInput').addEventListener('change',async e=>{
  const list=[...e.target.files];e.target.value='';
  const d=fileDoc();
  if(!d||!can('edit')){if(list.length)toast(tt('eNoPerm'));return}
  let added=0;
  for(const f of list){
    const okType=f.type==='application/pdf'||/^image\//.test(f.type)||/\.(pdf|jpe?g|png|webp|gif)$/i.test(f.name);
    if(!okType){toast(tt('tFileType'));continue}
    if(f.size>10*1048576){toast(tt('tFileTooBig'));continue}
    const id='f'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    try{await FS.put(id,f);(d.files=d.files||[]).push({id,name:f.name,size:f.size,type:f.type||'',at:Date.now(),by:me?me.user:''});added++}
    catch(x){toast(tt('tFileFail'))}
  }
  if(added){persistDoc();renderFiles();afterFilesChange();toast(tt('tAttached'))}
});

    try{await FS.del(fid,f&&f.size)}catch(x){}
    d.files=(d.files||[]).filter(x=>x.id!==fid);fileConfirm=null;persistDoc();renderFiles();afterFilesChange();toast(tt('tFileDeleted'));
  }
});
async function getBlob(f){try{return await FS.get(f.id,f.size,f.type)}catch(x){return null}}
async function previewFile(f){
  const blob=await getBlob(f);
  if(!blob){toast(tt('tFileFail'));return}
  revokePv();pvFile=f;pvUrl=URL.createObjectURL(blob);
  $('#pvTitle').textContent=f.name;
  const img=/^image\//.test(blob.type||f.type);
  $('#pvBody').innerHTML=img?`<img class="pvimg" alt="" src="${pvUrl}">`:(EMBEDDED?`<p class="hint">${esc(tt('pvHint'))}</p>`:`<iframe class="pvframe" title="${esc(f.name)}" src="${pvUrl}"></iframe>`);
  $('#pvActions').innerHTML=(EMBEDDED?'':`<button type="button" class="btn sm" data-pv="dl">${ic('pdf')}${esc(tt('download'))}</button>`)+`<button type="button" class="btn sm" data-pv="close">${esc(tt('close'))}</button>`;
  $('#pvModal').hidden=false;
}
async function downloadFile(f){
  const blob=await getBlob(f);
  if(!blob){toast(tt('tFileFail'));return}
  const u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),5000);
}
function revokePv(){if(pvUrl){URL.revokeObjectURL(pvUrl);pvUrl=''}$('#pvBody').innerHTML=''}
function closePv(){$('#pvModal').hidden=true;revokePv();pvFile=null}
$('#pvActions').addEventListener('click',e=>{
  const b=e.target.closest('[data-pv]');if(!b)return;
  if(b.dataset.pv==='dl'&&pvFile)downloadFile(pvFile);else closePv();
});
$('#pvModal').addEventListener('click',e=>{if(e.target===$('#pvModal'))closePv()});

/* ---------- users (admin) ---------- */
let editingUser=null,userConfirm=null;
const PERM_S={view:'pvS',create:'pcS',edit:'peS',delete:'pdS'};
function permChips(u){
  const t=T[lang];
  if(u.role==='admin')return `<span class="pm">${esc(t.allPerms)}</span>`;
  const on=PERMS.filter(p=>u.perms&&u.perms[p]);
  return on.length?on.map(p=>`<span class="pm">${esc(t[PERM_S[p]])}</span>`).join(''):`<span class="muted">${esc(t.noPerms)}</span>`;
}
function renderUsers(){
  const t=T[lang];
  $('#uList').innerHTML=`<div class="lhead ur"><span>${esc(t.colUser)}</span><span>${esc(t.colRole)}</span><span>${esc(t.colPerms)}</span><span>${esc(t.colStatus)}</span><span></span></div>`+users.map(u=>{
    const acts=userConfirm===u.id
      ?`<div class="confirm"><span>${esc(t.confirmDelUser)}</span><button type="button" class="btn sm danger" data-ua="delyes" data-uid="${u.id}">${esc(t.yes)}</button><button type="button" class="btn sm" data-ua="delno">${esc(t.no)}</button></div>`
      :`<div class="racts"><button type="button" class="btn sm" data-ua="edit" data-uid="${u.id}">${ic('edit')}${esc(t.edit)}</button><button type="button" class="btn sm icon danger" data-ua="del" data-uid="${u.id}" aria-label="${esc(t.del)}" title="${esc(t.del)}">${ic('trash')}</button></div>`;
    return `<div class="inv-row ur"><span class="cu"><b>${esc(u.user)}</b>${me&&u.id===me.id?`<span class="tag">${esc(t.you)}</span>`:''}</span><span>${esc(u.role==='admin'?t.roleAdmin:t.roleUser)}</span><span>${permChips(u)}</span><span><span class="st ${u.active?'active':'off'}">${esc(u.active?t.uStatusOn:t.uStatusOff)}</span></span>${acts}</div>`;
  }).join('');
}
function syncPermUi(){
  const adm=$('#u-role').value==='admin';
  PERMS.forEach(p=>{const el=$('#p-'+p);if(adm)el.checked=true;el.disabled=adm});
}
function openUserModal(id){
  editingUser=id?users.find(u=>u.id===id):null;
  const t=T[lang],u=editingUser;
  $('#uTitle').textContent=u?t.uEdit:t.uNew;
  $('#u-name').value=u?u.user:'';
  $('#u-pass').value='';$('#u-pass-l').textContent=u?t.passKeep:t.passNew;
  $('#u-role').value=u?u.role:'user';
  PERMS.forEach(p=>{$('#p-'+p).checked=u?(u.role==='admin'||!!(u.perms&&u.perms[p])):p==='view'});
  $('#u-active').checked=u?u.active:true;
  $('#u-err').textContent='';syncPermUi();
  $('#userModal').hidden=false;
  setTimeout(()=>{try{$('#u-name').focus()}catch(e){}},30);
}
$('#u-role').addEventListener('change',syncPermUi);
$('#u-perms').addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='p-view'&&!el.checked)['create','edit','delete'].forEach(p=>{$('#p-'+p).checked=false});
  else if(el.id!=='p-view'&&el.checked)$('#p-view').checked=true;
});
$('#uNew').onclick=()=>openUserModal(null);
$('#uClose').onclick=()=>{$('#userModal').hidden=true};
$('#userModal').addEventListener('click',e=>{if(e.target===$('#userModal'))$('#userModal').hidden=true});
$('#uForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const t=T[lang],err=$('#u-err');err.textContent='';
  const name=$('#u-name').value.trim(),pw=$('#u-pass').value,role=$('#u-role').value,active=$('#u-active').checked;
  const perms={};PERMS.forEach(p=>{perms[p]=(role==='admin'||$('#p-'+p).checked)?1:0});
  const selfId=editingUser?editingUser.id:null;
  if(name.length<3){err.textContent=t.eUser;return}
  if(users.some(x=>x.id!==selfId&&x.user.toLowerCase()===name.toLowerCase())){err.textContent=t.eUserTaken;return}
  if((!editingUser&&pw.length<6)||(pw&&pw.length<6)){err.textContent=t.ePwShort;return}
  if(editingUser&&me&&editingUser.id===me.id&&!active){err.textContent=t.eSelf;return}
  const admins=users.filter(x=>x.role==='admin'&&x.active&&x.id!==selfId).length+(role==='admin'&&active?1:0);
  if(admins<1){err.textContent=t.eLastAdmin;return}
  const rr=await apiJson('users',{op:editingUser?'update':'create',id:selfId,user:name,pw,role,perms,active});
  if(!rr.ok){const c=rr.data&&rr.data.error;err.textContent=c==='taken'?t.eUserTaken:c==='lastadmin'?t.eLastAdmin:c==='self'?t.eSelf:c==='short'?t.ePwShort:c==='user'?t.eUser:t.tSyncFail;return}
  users=rr.data.users;
  {const m=me&&users.find(x=>x.id===me.id);if(m)me=m}
  if(editingUser&&me&&editingUser.id===me.id){applyPerms();if(!allowed(view))show(landing())}
  $('#userModal').hidden=true;renderUsers();toast(t.tUserSaved);
});
$('#uList').addEventListener('click',e=>{
  const b=e.target.closest('[data-ua]');if(!b)return;
  const id=b.dataset.uid,a=b.dataset.ua;
  if(a==='edit')openUserModal(id);
  else if(a==='del'){userConfirm=id;renderUsers()}
  else if(a==='delno'){userConfirm=null;renderUsers()}
  else if(a==='delyes'){
    const u=users.find(x=>x.id===id);userConfirm=null;
    if(!u){renderUsers();return}
    if(me&&u.id===me.id){toast(tt('eSelf'));renderUsers();return}
    if(u.role==='admin'&&u.active&&users.filter(x=>x.role==='admin'&&x.active).length<=1){toast(tt('eLastAdmin'));renderUsers();return}
    apiJson('users',{op:'delete',id}).then(rr=>{
      if(rr.ok){users=rr.data.users;renderUsers();toast(tt('tUserDeleted'))}else{toast(tt('tSyncFail'));renderUsers()}
    });
  }
});

/* ---------- toast ---------- */
let toastTimer;
function toast(msg){const el=$('#toast');el.innerHTML='<span></span>';el.firstChild.textContent=msg;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.innerHTML=''},2800)}

/* ---------- boot ---------- */
$('#authLogo').src=LOGO;$('#sideLogo').src=LOGO;
$('#authForm').addEventListener('submit',onAuthSubmit);
$('#a-eye').onclick=()=>{const show=$('#a-pass').type==='password';$('#a-pass').type=show?'text':'password';$('#a-eye').textContent=show?tt('hidePw'):tt('showPw')};
$('#btnLogout').onclick=()=>{logout();toast(tt('tLoggedOut'))};
$('#btnPw').onclick=()=>{$('#pwForm').reset();$('#pw-err').textContent='';$('#pwModal').hidden=false;setTimeout(()=>{try{$('#pw-cur').focus()}catch(e){}},30)};
$('#pwClose').onclick=()=>{$('#pwModal').hidden=true};
$('#pwModal').addEventListener('click',e=>{if(e.target===$('#pwModal'))$('#pwModal').hidden=true});
$('#pwForm').addEventListener('submit',onPwSubmit);
if(ro){ro.observe($('#prevWrap'));ro.observe($('#modalWrap'));ro.observe($('#cPrevWrap'))}
window.addEventListener('resize',()=>{fit($('#prevWrap'));fit($('#modalWrap'));fit($('#cPrevWrap'))});
syncForm();
async function importLocal(){
  try{
    if(!isAdmin()||lsGet('firatnet.imported',false))return;
    const li=(lsGet(K_INV,[])||[]).filter(x=>x&&!x.example),lc=(lsGet(K_CT,[])||[]).filter(x=>x&&!x.example);
    if(!li.length&&!lc.length)return;
    if(invoices.length||contracts.length){lsSet('firatnet.imported',true);return}
    for(const d of li.concat(lc))for(const f of (d.files||[])){try{const b=await LFS.get(f.id);if(b)await FS.put(f.id,b)}catch(e){}}
    invoices=li;contracts=lc;persist();persistC();
    await syncQ;lsSet('firatnet.imported',true);
    updateCount();rerenderLists();toast(tt('tImported'));
  }catch(e){}
}
function rerenderLists(){
  if(view==='dash')renderDash();
  else if(view==='list')renderList();
  else if(view==='tower'||view==='complex')renderCtList();
  else if(view==='users')renderUsers();
}
let lastSig='';
async function poll(){
  if(!me||document.hidden||pendingSync)return;
  if(['#modal','#fileModal','#userModal','#pwModal','#pvModal'].some(sel=>!$(sel).hidden))return;
  let m;try{m=await loadState()}catch(e){return}
  if(!m){forceLogout();return}
  me=m;applyPerms();
  const sig=JSON.stringify([invoices,contracts,users]);
  if(sig!==lastSig){lastSig=sig;updateCount();if(!allowed(view))show(landing());else rerenderLists()}
}
setInterval(poll,20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
syncForm();
(async()=>{
  try{const m=await loadState();if(m){enterApp(m);lastSig=JSON.stringify([invoices,contracts,users]);importLocal()}else showAuth()}
  catch(e){showAuth()}
})();
})();
</script>
